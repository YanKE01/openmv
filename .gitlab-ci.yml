stages:
  - ai_review
  - build

ai_review:
  stage: ai_review
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache git curl jq
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      git diff --unified=0 --no-color \
        "$CI_MERGE_REQUEST_DIFF_BASE_SHA" \
        "$CI_COMMIT_SHA" > mr.diff
    - |
      if [ ! -s mr.diff ]; then
        echo "No diff found, skip."
        exit 0
      fi
    - |
      echo "Diff file size: $(wc -c < mr.diff) bytes"
    - DIFF_CONTENT="$(head -c 120000 mr.diff)"
    - |
      echo "Trimmed diff size: ${#DIFF_CONTENT} chars"
    - |
      PROMPT=$(jq -n \
        --arg title "$CI_MERGE_REQUEST_TITLE" \
        --arg source "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" \
        --arg target "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" \
        --arg diff "$DIFF_CONTENT" \
        '[
          "You are a senior software engineer performing a strict code review for a GitLab merge request.",
          "Review rules:",
          "1. Only report concrete, actionable issues.",
          "2. Focus on bugs, logic errors, null or undefined risks, exception handling, security issues, performance regressions, edge cases, and backward compatibility.",
          "3. Do not give praise or generic suggestions.",
          "4. If no clear issues are found, output exactly: 未发现明确缺陷。",
          "5. Output must be in Simplified Chinese Markdown.",
          "",
          "Please provide:",
          "1. A short overall conclusion",
          "2. A list of findings",
          "3. Specific fix suggestions when applicable",
          "",
          "MR Title: \($title)",
          "Source Branch: \($source)",
          "Target Branch: \($target)",
          "",
          "Diff:",
          $diff
        ] | join("\n")')
    - |
      echo "Prompt built: ${#PROMPT} chars"
    - |
      RESPONSE=$(curl --silent --show-error \
        --connect-timeout 10 \
        --max-time 180 \
        "$AI_BASE_URL/chat/completions" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $AI_API_KEY" \
        -d "$(jq -n \
          --arg model "$AI_MODEL" \
          --arg prompt "$PROMPT" \
          '{
            model: $model,
            messages: [
              {
                role: "system",
                content: "You are a strict code review assistant. Only report concrete defects and meaningful risks. Output in Simplified Chinese Markdown."
              },
              {
                role: "user",
                content: $prompt
              }
            ],
            temperature: 0.2
          }')")
    - |
      echo "AI response received"
    - REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
    - |
      if [ -z "$REVIEW" ]; then
        echo "AI review failed"
        echo "$RESPONSE"
        exit 1
      fi
    - BODY=$(printf "## AI Review\n\n%s" "$REVIEW")
    - |
      curl --silent --show-error --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --data-urlencode "body=$BODY" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"

build_esp32_p4x_eye:
  stage: build
  image: espressif/idf:v5.5.3
  tags:
    - build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script:
    - git submodule update --init --depth=1 --no-single-branch
    - git -C lib/micropython/ submodule update --init --depth=1
  script:
    - . /opt/esp/idf/export.sh
    - make -j$(nproc) TARGET=ESP32_P4X_EYE
  artifacts:
    when: on_success
    paths:
      - build/bin/
    expire_in: 1 week
